services:
  - type: web
    name: flowsynq-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://flowsynq-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: DEFAULT_PORT_NAME
        value: default
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SEAROUTES_API_KEY
        sync: false
      # Point Node backend at the Render Python services (not localhost)
      - key: PYTHON_AI_URL
        value: https://flowsynq-optimization.onrender.com
      - key: OPTIMIZATION_SERVICE_URL
        value: https://flowsynq-optimization.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://flowsynq-analytics.onrender.com/analytics/recommendations
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUBSCRIPTION_WEBHOOK_SECRET
        sync: false
      - key: DEMO_DURATION_DAYS
        value: "7"
      - key: DEMO_PORT_NAME
        value: FlowSynq Demo Port
      - key: NOMINATIM_USER_AGENT
        sync: false

  - type: static_site
    name: flowsynq-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://flowsynq-backend.onrender.com
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: flowsynq-optimization
    env: python
    plan: free
    buildCommand: pip install -r optimization_service/requirements.txt
    startCommand: cd optimization_service && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: flowsynq-analytics
    env: python
    plan: free
    buildCommand: pip install -r optimization_service/requirements.txt
    startCommand: cd optimization_service && python analytics_service.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
