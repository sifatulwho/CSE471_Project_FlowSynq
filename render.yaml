services:
  - type: web
    name: flowsynq-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        scope: build,runtime
        sync: false
      - key: JWT_SECRET
        scope: build,runtime
        sync: false
      - key: SESSION_SECRET
        scope: build,runtime
        sync: false
      - key: CLIENT_URL
        value: https://flowsynq-frontend.onrender.com
        scope: build,runtime
        sync: false 
      - key: GOOGLE_CLIENT_ID
        scope: runtime
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        scope: runtime
        sync: false
      - key: GOOGLE_CALLBACK_URL
        scope: runtime
        sync: false
      - key: OPENWEATHER_API_KEY
        scope: runtime
        sync: false
      - key: SEAROUTES_API_KEY
        scope: runtime
        sync: false
      - key: OPTIMIZATION_SERVICE_URL
        scope: runtime
        sync: false
      - key: ANALYTICS_SERVICE_URL
        scope: runtime
        sync: false

  - type: static_site
    name: flowsynq-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://flowsynq-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 466548527072-98q67818i2h6416uvit9111gqhmm1u1q.apps.googleusercontent.com

  - type: web
    name: flowsynq-optimization
    env: python
    plan: free
    buildCommand: pip install -r optimization_service/requirements.txt
    startCommand: cd optimization_service && python main.py
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: flowsynq-analytics
    env: python
    plan: free
    buildCommand: pip install -r optimization_service/requirements.txt
    startCommand: cd optimization_service && python analytics_service.py
    envVars:
      - key: PORT
        value: 8001
